<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockWise - Stock Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <a class="logo" href="index.html">📈 Stock<span>Wise</span></a>
    <div class="header-right">
      <a class="back-link" href="index.html">← Dashboard</a>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle dark and light mode">🌙</button>
            <a class="nav-link" href="portfolio.html">Portfolio</a>

      <div class="bell-wrap">
        <button id="bellBtn" class="icon-btn" aria-label="Notifications">
          🔔<span id="bellCount" class="bell-count" hidden>0</span>
        </button>
        <div id="bellPanel" class="bell-panel" hidden>
          <button id="enablePush" class="btn" hidden>Enable browser alerts</button>
          <div class="bell-head">
            <b>Notifications</b>
            <span>
              <button id="markRead" class="link-btn">Mark all read</button>
              <button id="clearAll" class="link-btn">Clear</button>
            </span>
          </div>
          <ul id="bellList"></ul>
        </div>
      </div>
      <div id="toastBox" class="toast-box"></div>
    </div>
  </header>

  <main id="stockView" class="container"></main>

  <footer class="footer">Data may be delayed. Not financial advice.</footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="data.js"></script>
  <script src="alerts.js"></script>
  <script src="stock.js"></script>
</body>
</html>
