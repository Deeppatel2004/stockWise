<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockWise - Stock Details</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2962ff">
  <script src="pwa.js" defer></script>
</head>
<body>

  <header class="header">
    <a class="logo" href="index.html">📈 Stock<span>Wise</span></a>
    <div class="header-right">
      <a class="back-link" href="index.html">← Dashboard</a>
            <a class="nav-link" href="portfolio.html">Portfolio</a>
      <a class="nav-link" href="news.html">News</a>
      <a class="nav-link" href="compare.html">Compare</a>
            <a class="nav-link" href="settings.html">Settings</a>

      <div class="bell-wrap">
        <button id="bellBtn" class="icon-btn" aria-label="Notifications">
          🔔<span id="bellCount" class="bell-count" hidden>0</span>
        </button>
        <div id="bellPanel" class="bell-panel" hidden>
          <button id="enablePush" class="btn" hidden>Enable browser alerts</button>
          <div class="bell-head">
            <b>Notifications</b>
            <span>
              <button id="markRead" class="link-btn">Mark all read</button>
              <button id="clearAll" class="link-btn">Clear</button>
            </span>
          </div>
          <a class="link-btn" href="history.html" style="display:block;padding:6px 12px">Alert history</a>
          <ul id="bellList"></ul>
        </div>
      </div>
      <div id="toastBox" class="toast-box"></div>
    </div>
  </header>

  <main id="stockView" class="container"></main>

  <footer class="footer">Data may be delayed. Not financial advice.</footer>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="alerts.js"></script>
  <script src="stock.js"></script>
  <script src="news.js"></script>
  <script src="buy.js"></script>
  <script src="ui.js"></script>
</body>
</html>
