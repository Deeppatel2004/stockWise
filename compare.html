<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockWise - Compare stocks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2962ff">
  <script src="pwa.js" defer></script>
</head>
<body>

  <header class="header">
    <a class="logo" href="index.html">📈 Stock<span>Wise</span></a>
    <div class="header-right">
      <a class="nav-link" href="index.html">Dashboard</a>
      <a class="nav-link" href="portfolio.html">Portfolio</a>
      <a class="nav-link" href="news.html">News</a>

      <div class="bell-wrap">
        <button id="bellBtn" class="icon-btn" aria-label="Notifications">
          🔔<span id="bellCount" class="bell-count" hidden>0</span>
        </button>
        <div id="bellPanel" class="bell-panel" hidden>
          <button id="enablePush" class="btn" hidden>Enable browser alerts</button>
          <div class="bell-head">
            <b>Notifications</b>
            <span>
              <button id="markRead" class="link-btn">Mark all read</button>
              <button id="clearAll" class="link-btn">Clear</button>
            </span>
          </div>
          <a class="link-btn" href="history.html" style="display:block;padding:6px 12px">Alert history</a>
          <ul id="bellList"></ul>
        </div>
      </div>
      <div id="toastBox" class="toast-box"></div>

    </div>
  </header>

  <main class="container">
    <h2>Compare stocks</h2>
    <p class="settings-intro">Add up to 4 stocks. The chart shows how much each one moved over the period, all starting from 0%.</p>
    <div class="card">
      <div id="cmpChips" class="tf-buttons chart-mode"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <input id="cmpInput" list="cmpList" type="text" placeholder="Add a stock (e.g. TCS)" autocomplete="off" style="padding:6px 10px;border-radius:8px;border:1px solid rgba(128,128,128,.4);background:transparent;color:inherit" />
        <datalist id="cmpList"></datalist>
        <button class="btn" id="cmpAdd">Add</button>
      </div>
      <div id="cmpRanges" class="tf-buttons">
        <button class="tf-btn" data-range="1M">1M</button>
        <button class="tf-btn" data-range="6M">6M</button>
        <button class="tf-btn" data-range="1Y">1Y</button>
        <button class="tf-btn" data-range="5Y">5Y</button>
      </div>
      <div id="cmpChart" style="height:380px;margin-top:8px"></div>
      <p id="cmpNote" class="empty"></p>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Stock</th><th>Start</th><th>Latest</th><th>Change</th><th>High</th><th>Low</th></tr></thead>
        <tbody id="cmpBody"></tbody>
      </table>
      <p id="cmpWinner"></p>
    </div>
  </main>

  <footer class="footer">Data may be delayed. Not financial advice.</footer>

  <script src="data.js"></script>
  <script src="api.js"></script>
  <script src="alerts.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="compare.js"></script>
</body>
</html>
